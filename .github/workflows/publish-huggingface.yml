name: Publier sur Hugging Face

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-huggingface
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Valider la démonstration statique
        run: |
          python -m pip install huggingface-hub==1.33.0
          python - <<'PY'
          import json, math
          from html.parser import HTMLParser
          from pathlib import Path
          import yaml
          source = Path('space-static')
          assert {p.name for p in source.iterdir()} == {'index.html', 'README.md'}
          html = (source / 'index.html').read_text()
          config = yaml.safe_load((source / 'README.md').read_text().split('---', 2)[1])
          assert config['sdk'] == 'static' and config['app_file'] == 'index.html'
          assert len(config['short_description']) <= 60
          class Extract(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.capture = False
                  self.payload = ''
              def handle_starttag(self, tag, attrs):
                  if tag == 'script' and dict(attrs).get('id') == 'demo-data':
                      self.capture = True
                  assert not (tag == 'script' and dict(attrs).get('src')), 'Script externe inattendu'
              def handle_endtag(self, tag):
                  if tag == 'script':
                      self.capture = False
              def handle_data(self, text):
                  if self.capture:
                      self.payload += text
          parser = Extract()
          parser.feed(html)
          data = json.loads(parser.payload)
          assert data['rows'] and data['features']
          assert len({r['enrolment'] for r in data['rows']}) == len(data['rows'])
          for row in data['rows']:
              assert 0 <= row['risk'] <= 1
              assert len(row['shap']) == len(data['features']) == len(row['values'])
              assert math.isclose(row['base'] + sum(row['shap']), row['risk'] * 100, abs_tol=1e-4)
          users = {r['user'] for r in data['rows']}
          assert all(u in users for u in data['top'] + data['low'])
          assert 'data:image/png;base64,' in html
          assert '__MOODLE_DATA__' not in html and '__GLOBAL_IMAGE__' not in html
          print(f"Export validé : {len(data['rows'])} inscriptions, {len(users)} stagiaires.")
          PY

      - name: Publier le Space statique
        env:
          HF_TOKEN: ${{ secrets.MOODLE_ABANDON }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          repo_id = os.environ.get('HF_SPACE_ID', '')
          token = os.environ.get('HF_TOKEN', '')
          if not repo_id or not token:
              raise SystemExit('Configurez HF_SPACE_ID et le secret MOODLE_ABANDON dans GitHub.')
          api = HfApi(token=token)
          api.repo_info(repo_id=repo_id, repo_type='space')
          api.upload_folder(
              repo_id=repo_id, repo_type='space', folder_path='space-static',
              allow_patterns=['index.html', 'README.md'],
              delete_patterns=['app.py', 'demo.parquet', 'requirements.txt'],
              commit_message='Publier la démonstration statique sans serveur Python ni GPU',
          )
          info = api.space_info(repo_id)
          if info.sdk != 'static':
              raise SystemExit('Le Space doit utiliser le SDK Static HTML. Vérifiez les paramètres du Space.')
          print(f'https://huggingface.co/spaces/{repo_id}')
          PY
